  <!-- Share metadata.
       There was a bare <title> and nothing else, so every shared link rendered
       as "DeepWood" with no line of explanation and no preview image. The copy
       matches the X/Telegram positioning: the differentiator is that the
       leaderboard ranks EFFICIENCY rather than wealth, which is the one thing
       a whale-first design cannot copy without breaking its own economy.

       Kept honest about the state of the build: "live on testnet". No token
       exists, so no ticker is claimed here. -->
  <meta name="description" content="Gem-hunting game. Off-chain hunting, on-chain settlement. The leaderboard ranks efficiency, not wealth &mdash; spend buys volume, never outcome. Live on testnet." />

  <!-- Start the emblem's 142KB fetch before the body is parsed. It used to
       begin only when the parser reached the splash, by which point the 1.5MB
       game bundle had already taken the connection. -->
  <link rel="preload" as="image" href="/launch/hero.jpg" fetchpriority="high" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1a10'/%3E%3Cpath d='M16 6l6 10-6 10-6-10z' fill='%234a7c59'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/hud.css" />

<body>
  <!-- The emblem, while the forest streams its first chunks. -->
  <div id="boot">
    <div>
      <!-- decode="async" so a slow JPEG never blocks the first paint of the
           page, and the class below is how the splash knows it may leave. -->
      <img class="emblem" src="/launch/hero.jpg" alt="" width="1280" height="698"
           decoding="async" fetchpriority="high" />
      <div class="wordmark">DEEPWOOD</div>
      <div class="tagline">ENTERING THE HOLLOW</div>
    </div>
  </div>

  <div id="game"></div>

  <!-- The splash, in one mechanism.
       Four gates and two inline scripts replaced this once, and it was worse
       every time: the logo never painted, then it flashed for 50ms, and the
       failure mode was always "several exits racing one resource". So there is
       now exactly one, and it owns the whole lifecycle:

         1. decode() the emblem -- resolves when it is decoded AND paintable,
            which is the thing that actually has to happen before the splash
            may go. Rejects on a broken image, which is handled, not thrown.
         2. then hold for MIN_SHOW_MS, so it is a title card and not a flash.
         3. hand over, once. finish() is idempotent.

       A single unconditional CEILING runs from the start regardless, because a
       splash that can strand a player behind a logo is worse than a splash
       without one. The ceiling is the only thing that can fire before step 2.

       Nothing outside this script touches #boot. The scene no longer has an
       opinion about the splash at all. -->
  <script>
    (function () {
      var MIN_SHOW_MS = 1500;   // once decoded, stay up this long
      var CEILING_MS  = 5000;   // absolute, from this script running

      var boot = document.getElementById('boot');
      var img  = document.querySelector('#boot .emblem');
      var ceiling = setTimeout(finish, CEILING_MS);
      var floor = null;
      var done = false;

      function finish() {
        if (done) return;
        done = true;
        clearTimeout(ceiling);
        clearTimeout(floor);
        if (boot) {
          boot.classList.add('done');
          setTimeout(function () { if (boot.parentNode) boot.remove(); }, 700);
        }
      }

      // A missing or broken image must not throw: the wordmark and tagline are
      // still there, and the ceiling will clear the splash regardless.
      var ready = (img && img.decode)
        ? img.decode().catch(function () {})
        : Promise.resolve();

      ready.then(function () {
        if (done) return;              // ceiling already fired
        floor = setTimeout(finish, MIN_SHOW_MS);
      });
    })();
  </script>

  <!-- HUD. Discrete floating tiles over the forest -- no panels, no cards.
       See src/hud.css for the layout rules. -->
  <div id="hud">
    <!-- LEFT: season identity, stats and satchel as SEPARATE floating tiles.
         There is deliberately no container: the reference art has no panel
         behind its controls, and wrapping these in one box is what rebuilt the
         header card as two smaller ones. Each cluster carries its own tile. -->
    <section id="season">
      <div class="season-head readout" style="position:relative">
        <!-- Player portrait: a vibe viber (vibevibe.fun PFP collection). It is
             the PLAYER AVATAR in the card, not the walker -- the collection is
             1080x1080 head-and-shoulders PFPs, which have no direction and no
             silhouette at the 64px the map needs. Used here, where portrait
             framing is the correct format. -->
        <img class="avatar" src="/art/viber.png" width="32" height="32"
             alt="Player portrait" aria-hidden="true">
        <!-- The season name is CHAIN STATE, not decoration. It was a hardcoded
             "Season I - Verdant Hollow" string, so after the V2 cutover it kept
             claiming Season I while the deployed contract was in Preseason --
             a header that lied about the phase the player was actually in.

             It starts as "Connecting..." rather than a guess, because a wrong
             season name is worse than an absent one: it implies the chain has
             been read when it has not. paintSeasonState() fills it in from
             phase() and current(). -->
        <span class="card-title" id="season-title">Connecting&hellip;</span>
      </div>
      <div class="season-grid readout">
        <div class="stat"><span class="k">Rank</span><span class="v hi" id="rank">&mdash;</span></div>
        <div class="stat"><span class="k">ROI</span><span class="v" id="roi">&mdash;</span></div>
        <div class="stat"><span class="k">Finds</span><span class="v" id="finds">&mdash;</span></div>
      </div>

      <!-- Satchel: the find tally by rarity, its own tile. -->
      <div id="satchel" class="readout" hidden>
        <span class="card-title">Satchel</span>
        <div id="gemlist"></div>
      </div>
    </section>

    <!-- TOP CENTRE: the gem tally as ICONS + counts, replacing the satchel's
         text tiles. Five AI-generated cut-gem icons, one per rarity, each with
         its live on-chain balance. No labels -- the icon IS the rarity. -->
    <div id="gemstrip" class="readout"></div>

    <!-- CENTRE: the season/chain status chip, centred under the top edge so the
         chain state is readable without a full-width bar holding it. -->
    <div id="status">
      <div class="chip" id="chainstat"><span class="dot warn"></span><span id="chaintext">checking&hellip;</span></div>
    </div>

    <!-- RIGHT: the toolbelt. Discrete tiles, no container -- the reference art
         floats its controls straight on the scene. -->
    <div id="belt">
      <span class="belt-counts readout" id="belt-counts">no tool yet</span>
      <span class="belt-mode" id="belt-mode">PREVIEW - simulation only</span>
      <div class="belt-tool readout" id="belt-tool">no tool - buy Wood to start hunting</div>
      <div class="belt-actions" id="belt-actions"></div>
      <span class="belt-msg" id="belt-msg"></span>
    </div>

    <!-- Icon buttons: circular, docked to the panel corners, matching the
         reference art's round back/confirm controls. -->
    <button type="button" id="leaderboard-btn" class="icon-btn" aria-label="Leaderboard" title="Leaderboard">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M4 13h4v7H4zM10 8h4v12h-4zM16 4h4v16h-4z" fill="currentColor"/>
      </svg>
    </button>
    <button class="icon-btn" id="connect" aria-label="Connect wallet" title="Connect wallet">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h1Zm2 0h6V7a3 3 0 0 0-6 0v3Z" fill="currentColor"/>
      </svg>
    </button>
  </div>

        <div id="hint" class="chip"></div>

  <!-- Error reporting installed FIRST, before any other module runs, so it
       captures throws from the game boot as well as from the HUD below.
       Without an endpoint configured it is a local ring buffer and a console
       log only -- see src/reporter.js. No third party is contacted unless
       VITE_ERROR_REPORT_URL is set at build time. -->
  <script type="module">
    import { createReporter, REPORT_ENDPOINT, initSentry } from '/src/reporter.js';
    window.__reporter = createReporter({ endpoint: REPORT_ENDPOINT });
    window.__reporter.install(window);
    // Dynamic import, so Sentry is only fetched when a DSN is configured. If it
    // is absent or fails, the game is unaffected -- telemetry must never be a
    // reason the game does not start.
    initSentry().then((sdk) => { if (sdk) window.__reporter.attachSentry(sdk); });
  </script>
  <script type="module" src="/src/main.js"></script>
  <script type="module">
    // Report the real chain state in the topbar. The game is playable
    // offline, so this only ever ADDS information -- a failure downgrades to
    // the simulation and says so, rather than leaving "checking chain…"
    // up forever or implying the site is live when it is not.
    import { bootChain, describe, withRetry } from '/src/live.js';

    const stat = document.getElementById('chainstat');
    const dot = stat.querySelector('.dot');
    const chainText = document.getElementById('chaintext');
    // #walletfoot was inside the satchel, which now starts hidden. The note is
    // persistent state, so it gets its own always-visible chip.
    const foot = document.getElementById('hint');

    // Rendered as a settled STATE, not an action in progress.
    //
    // This line used to read "Reading the live contract…" and it was NOT a
    // loading state -- it was the success message, written in present
    // progressive. Because the read finishes in about a second, the text was
    // almost always describing work that had already completed, so a live,
    // healthy game looked like it was permanently still trying. A player took
    // it for a hang. It now states what being live MEANS instead.
    const render = (r) => {
      if (r.ok) {
        const at = r.chain.address.slice(0, 6) + '…' + r.chain.address.slice(-4);
        chainText.textContent = 'live · ' + at;
        dot.className = 'dot ok';
        stat.title = describe(r);
        // Disarm the retry affordance: a live read must not leave a chip that
        // still looks clickable, or a later offline state reuses a stale handler.
        stat.style.cursor = '';
        stat.onclick = null;
        if (r.drift && r.drift.length) {
          // Loud, but not fatal: the simulation is still playable.
          foot.textContent = 'Client differs from contract: ' + r.drift.join('; ');
          foot.className = 'chip';
          dot.className = 'dot warn';
        } else {
          // Accurate as long as the season has a committed seed. Without one,
          // settleHunt would revert SeedNotCommitted, so do not advertise it.
          //
          // `r` is the bootChain result. This used to read a bare `live`, which
          // was never in scope -- render() threw "ReferenceError: live is not
          // defined", the surrounding .catch() swallowed it as an RPC failure,
          // and the whole site reported "offline · retry" while the chain was
          // completely healthy. A render bug disguised as an infrastructure
          // outage.
          const seedReady = !!(r.onChain && r.onChain.current && r.onChain.current.seedCommitted);
          const open = r.onChain ? r.onChain.seasonOpen : null;
          foot.textContent = seedReady
            ? 'Live contract. Connect a wallet to claim tools, buy gems and settle your own hunts on chain.'
            : 'Live contract. Connect a wallet to claim tools and buy gems on chain. Hunts settle once the season seed is committed.';
          // The "Season I is closed, hunts will not settle" notice is gone. It
          // was a permanent bottom banner across the playfield for a condition
          // that is the owner's to change and the player's to notice, not to be
          // told about on every screen. The closed state is still visible where
          // it matters: the belt's own PREVIEW line and the chain chip.
        }
        return;
      }
      chainText.textContent = 'offline · retry';
      dot.className = 'dot bad';
      stat.title = (r.reason || '') + ' — tap to retry';
      // The retry affordance goes on the TOPBAR chip, not in #walletfoot.
      // #walletfoot is shared with the wallet module, and that module owns the
      // line outright whenever the chain is not ok -- it overwrites
      // textContent, which would delete a button appended there. Putting it on
      // the chip keeps it out of two writers' way.
      stat.style.cursor = 'pointer';
      stat.onclick = () => check();
      foot.textContent = 'Offline simulation — ' + (r.reason || 'could not reach the chain.');
    };

    // Three tries with backoff. The read was measured failing on roughly one
    // load in three, and a single dropped connection used to downgrade the
    // session to the offline simulation permanently.
    const check = () => withRetry(() => bootChain()).then((r) => {
      // Published so the wallet script below can tell "the chain is live" from
      // "we are offline" without clobbering this message.
      window.deepwoodChain = r;
      render(r);
    }).catch((e) => {
      // This .catch() is what turned the production ReferenceError into a
      // believable "offline · retry". Swallowing a render bug as an
      // infrastructure state is how it survived a deploy and a green test
      // suite. Report it, then still degrade gracefully -- but never silently.
      window.__reporter?.reportError(e, 'bootChain');
      window.deepwoodChain = { ok: false, reason: String(e && e.message || e) };
      render({ ok: false, reason: String(e && e.message || e) });
    });

    check();
  </script>
  <script>
    // Bridge Phaser scene state into the DOM shell. Keeps the economy
    // readout honest without duplicating game logic in two places.
    // Anchored once per page load so the ring animates from a real start
    // instead of being re-zeroed on every tick.
    const START = Date.now();
    // Short labels for the inline satchel tiles: "SAPPHIRE 0" will not fit a
      // fifth of the toolbelt column next to a number, and truncating it to
      // "SAPPH…" helps nobody. The full name stays in the title attribute, so
      // the abbreviation costs nothing but the vowel.
    const gemNames = ['Quartz', 'Amber', 'Sapphire', 'Ruby', 'Diamond'];
    const gemShort = ['Qtz', 'Amb', 'Sapph', 'Ruby', 'Diam'];
    const gemColors = ['#cfd6dd', '#d9a441', '#3a6fd8', '#d83a5a', '#8a3ad8'];
    const gemlist = document.getElementById('gemlist');
    const satchel = document.getElementById('satchel');

    // The satchel reads the player's gem balance DIRECTLY now.
    //
    // It used to keep its own private `totals[]`, incremented from the hunt
    // result alongside a second counter in ForestScene.js. Two counters for one
    // quantity: the header said COMMON 11 while the satchel said Qtz 11, and
    // the moment you spent any Common only ONE of them was decremented, so the
    // card answered "how many do I have" two different ways at once.
    //
    // `playerBalance()` is defined below and reads the single balance the
    // economy owns. The satchel can no longer disagree with it.
    const totals = [0, 0, 0, 0, 0];
    function playerBalance() {
      const p = window.__scene?.econ;
      return p && Array.isArray(p.gems) ? p.gems : totals;
    }

    // The gem strip (top-centre) replaces the satchel entirely. Five
    // AI-generated cut-gem icons with their live counts -- no labels, the
    // icon is the rarity.
    const gemstrip = document.getElementById('gemstrip');
    const gemIcons = [
      '/art/gem-quartz.png',
      '/art/gem-amber.png',
      '/art/gem-sapphire.png',
      '/art/gem-ruby.png',
      '/art/gem-diamond.png',
    ];

    function renderGems() {
      // All five rarities, ALWAYS, including the ones still at zero.
      //
      // This used to emit a row only for rarities with a non-zero count and
      // hide the panel entirely when the list came back empty. Now that the
      // satchel is a permanent part of the header card, an absent row would read
      // as a rendering fault rather than as "not found one yet" -- the player
      // cannot tell the difference between "you have found no ruby" and "this
      // box is broken". A zero is information: it names the rarity as a target.
      const bal = playerBalance();
      // Satchel markup is kept for backwards compat but the element is
      // hidden. The top-centre gemstrip is the live display.
      gemlist.innerHTML = gemNames.map((n, i) => {
        const c = bal[i];
        return `<div class="gem${c ? '' : ' none'}" title="${n}: ${c}">`
          + `<span class="n" style="color:${gemColors[i]}">${n.slice(0, 3)}</span>`
          + `<span class="c">${c}</span></div>`;
      }).join('');

      // The live top-centre strip.
      gemstrip.innerHTML = bal.map((c, i) =>
        `<div class="gem-ic" title="${gemNames[i]}: ${c}">`
        + `<img src="${gemIcons[i]}" alt="${gemNames[i]}" draggable="false">`
        + `<span class="gc${c ? '' : ' zero'}">${c}</span></div>`
      ).join('');
    }
    // Exposed so the belt's buy/repair/sell handlers can repaint the satchel
    // after they change the balance. Without this the satchel only refreshed on
    // a hunt, so selling gems left the tiles showing the pre-sale count.
    window.renderGems = renderGems;

    // Pending-batch badge: how many hunts sit in the settle queue. Written by
    // ForestScene after every dig and settle. Kept on the belt-mode line so it
    // is visible at ALL times while queued (a reload drops the queue), not only
    // when the settle button happens to be in view.
    const badge = document.createElement('span');
    badge.id = 'queue-badge';
    badge.className = 'queue-badge hidden';
    // Sibling of #belt-mode, NOT a child: syncBeltDom() rewrites
    // mode.textContent, which would destroy any child node and with it the
    // badge the queue just wrote to. This exact failure already shipped once.
    const modeEl = document.getElementById('belt-mode');
    if (modeEl) modeEl.insertAdjacentElement('afterend', badge);
    window.renderQueue = (queued) => {
      if (queued > 0) {
        badge.textContent = `${queued} pending - settle to bank`;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    };
    // Phaser's TouchManager attaches a WINDOW-level listener (default config)
    // and dispatches canvas input for any touch whose target isn't the canvas
    // itself -- so taps on the DOM HUD top bar (including the queue badge at
    // the corner where Phaser's BOARD zone lives) would ALSO fire the zone
    // underneath. The gate Phaser honours is event.defaultPrevented, which
    // raises a new problem: preventDefault on touchstart SUPPRESSES the
    // synthetic click for the SETTLE button, and the player can't bank.
    //
    // Solve it with a guard instead: don't preventDefault the event at all --
    // mark Phaser's listener as fired already and stopImmediatePropagation
    // from a capture-phase listener attached to the #hud. Capture on #hud
    // runs BEFORE window bubble, so Phaser's top-level handler never runs for
    // HUD-targeted taps, but click still propagates for real buttons.
    const hud = document.getElementById('hud');
    if (hud) {
      const shield = (e) => {
        // Only shield taps that origin INSIDE the HUD. Taps on the canvas
        // (which contains the real HUNT pad and d-pad) have a canvas target
        // and shouldn't come through here anyway -- but belt-and-suspenders:
        // if some wrapper puts the canvas inside #hud, bail out so we don't
        // mute the game.
        const onCanvas = e.target && (e.target.tagName === 'CANVAS');
        if (onCanvas) return;
        // Standard synthetic-event suppression: preventDefault + stop both
        // propagation directions so Phaser's window listener never fires.
        // Phaser only checks event.defaultPrevented / does not see the event
        // at all because its handler is on window and we stopPropagation
        // before bubble reaches window.
        e.stopPropagation();          // stop bubble to window (blocks Phaser)
        // NOTE: do NOT preventDefault. Doing so kills the synthetic click on
        // the SETTLE button -- which is how the badge-settle regression snuck
        // in. Click must still fire on the button and bubble normally to any
        // click handler attached to it.
      };
      hud.addEventListener('touchstart', shield, false);
      hud.addEventListener('touchend',   shield, false);
      hud.addEventListener('touchmove',  shield, false);
    }
    // Pulse the settle button when the gate message fires, so the eye lands on
    // the ONE action that unblocks hunting.
    window.pulseSettle = () => {
      const st = document.getElementById('belt-settle');
      if (!st) return;
      st.classList.remove('pulse');
      void st.offsetWidth; // restart the CSS animation on a re-trigger
      st.classList.add('pulse');
    };

    // Kept as a no-op because two call sites in ForestScene.js still invoke it
    // when gems are spent, and they are load-bearing for the spend path.
    //
    // It used to hide the panel. It cannot any more: the satchel now lives in
    // the permanent header card and carries the season's find tally, so hiding
    // it on a purchase would blank the player's whole record of the season.
    // Spending gems does not un-find them.
    window.retireSatchel = () => { /* the satchel is permanent now */ };
    renderGems();

    // Countdown. Drives the ENDS text and the season progress bar.
    //
    // This used to also drive a circular ring in the card head. The ring was
    // deleted because it duplicated what ENDS and the bar already said, in a
    // third visual language, for 26px of a card that had been cut for height.
    window.addEventListener('deepwood:find', (e) => {
      const r = e.detail;
      r.counts.forEach((c, i) => { totals[i] += c; });
      renderGems();
      renderGems();
    });

    </script>
  <script type="module">
    // Wallet connect. Replaces a fake handler that hardcoded '0x1234…abcd'.
    //
    // The scene knows nothing about accounts; this shell does, and it is the
    // only place window.ethereum is touched. No private key exists anywhere in
    // the client -- every write is handed to the wallet, which prompts the
    // user. See src/wallet.js.
    import { connect, disconnect, switchToGameChain, getState, onWallet, GAME_CHAIN_ID } from '/src/wallet.js';

    const btn = document.getElementById('connect');
    const foot = document.getElementById('hint');
    // Render must not crash the connect handler if the footer was ever removed
    // from the card. `foot.title` on null threw inside render(), which is
    // called from onWallet() -- a provider event -- so a missing node broke
    // every later state update as well as the click.
    // #walletfoot is shared with the chain module above. When the chain is
    // live its message is the more important one, so the wallet state goes to
    // the tooltip and a data attribute; when it is offline there is nothing to
    // protect and the wallet owns the line.
    const noteWallet = (msg) => {
      if (!foot) return;
      foot.dataset.wallet = msg;
      if (!window.deepwoodChain?.ok) {
        foot.textContent = msg;
        return;
      }
      foot.title = (foot.title ? foot.title.split('\nwallet ')[0] + '\n' : '') + 'wallet: ' + msg;
    };

    const short = (a) => a ? a.slice(0, 6) + '…' + a.slice(-4) : '';

    /**
     * A message set by the last action, which render() must not clobber.
     *
     * noteWallet() was always followed by render(), and render() recomputes the
     * line from scratch -- so every specific failure ("rejected in the wallet",
     * "no wallet detected") was overwritten within the same tick by the generic
     * state text. The player saw "Wrong network..." or the default hint instead
     * of why their click did nothing. Kept as a one-shot: the next successful
     * state clears it, so it cannot go stale.
     */
    let pendingMsg = null;
    const setPending = (m) => { pendingMsg = m; };

    // The connect control is an ICON button (circular, wallet glyph). The
    // wallet state therefore cannot be written with textContent -- that would
    // destroy the <svg> glyph and leave an empty circle. State goes to a badge
    // class + the title instead, and the icon stays put.
    const setIconState = (state, title) => {
      btn.classList.remove('warn', 'ok');
      if (state) btn.classList.add(state);
      btn.title = title || '';
    };

    function render() {
      const s = getState();
      if (s.connected) {
        pendingMsg = null; // connected: the state text is the true one
        setIconState('ok', `${s.account}\nchain ${s.chainId} · writes go to the DeepWood contract`);
        noteWallet(`Wallet ${short(s.account)} on chain ${s.chainId}. Buy gems and claim tools in the shop.`);
        return;
      }
      if (s.account && !s.rightChain) {
        // Wrong chain is NOT connected -- same stance live.js takes on reads.
        // Offer the switch instead of pretending the wallet is ready.
        setIconState('warn', `Wallet ${short(s.account)} is on chain ${s.chainId}; the game is on ${GAME_CHAIN_ID}.`);
        // pendingMsg wins: it says WHY the switch did not happen ("rejected in
        // the wallet"), which is more useful than restating the mismatch the
        // player can already see in the button label.
        noteWallet(pendingMsg || `Wrong network: wallet on chain ${s.chainId}, game on ${GAME_CHAIN_ID}.`);
        return;
      }
      setIconState('', 'Connect wallet');
      noteWallet(pendingMsg || 'Off-chain preview. Connect a wallet to buy a tool and sell gems.');
    }

    /**
     * Connect, and switch network in the SAME click.
     *
     * This used to check for a wrong chain BEFORE connecting and only then
     * switch, so the very first click on a wallet sitting on mainnet just
     * discovered the mismatch, changed the button to "Switch to chain 46630",
     * and did nothing else. The player had to click a second time to be
     * anywhere -- and since the button had visibly changed and looked live,
     * the first click read as "connect is broken" rather than "one step of a
     * two-step flow".
     *
     * Now: connect, and if that lands on the wrong chain, switch immediately.
     * One click, or one clear error.
     */
    async function doConnect() {
      btn.disabled = true;
      try {
        const r = await connect();

        if (!r.ok && r.code === 'wrong-chain') {
          // The account is real and approved. Just on the wrong network --
          // finish the job rather than bouncing the player back.
          const sw = await switchToGameChain();
          if (sw.ok) {
            render();
            return;
          }
          setPending('Connected, but could not switch to chain ' + GAME_CHAIN_ID
            + ' (' + sw.reason + '). Switch it in your wallet, then press again.');
          render();
          return;
        }

        if (!r.ok) {
          // Rejections and missing-provider cases are worth saying out loud.
          setPending(r.code === 'rejected' ? 'Connection rejected in the wallet.'
            : r.code === 'no-provider' ? 'No wallet detected. Install an EIP-1193 wallet to play onchain.'
            : 'Connect failed: ' + r.reason);
        }
        render();
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', () => {
      const s = getState();
      if (s.connected && btn.dataset.open !== '1') {
        // Already connected: a click should not silently re-connect (the
        // address is already there); it should offer the way OUT. Show a
        // one-item menu. Outside click or Escape dismisses it.
        openWalletMenu();
        return;
      }
      doConnect();
    });

    // The disconnect menu: a single-item dropup rendered beside the connect
    // button. One item only because the ONLY sensible action from here is
    // "disconnect". It clears our local state and asks the wallet to drop the
    // eth_accounts permission so the next eth_requestAccounts prompts again.
    let walletMenu = null;
    function closeWalletMenu() {
      walletMenu?.remove();
      walletMenu = null;
      delete btn.dataset.open;
      document.removeEventListener('click', outsideClose, true);
      document.removeEventListener('keydown', escClose, true);
    }
    function outsideClose(e) {
      if (walletMenu && !walletMenu.contains(e.target) && e.target !== btn) closeWalletMenu();
    }
    function escClose(e) { if (e.key === 'Escape') closeWalletMenu(); }

    function openWalletMenu() {
      closeWalletMenu();
      walletMenu = document.createElement('div');
      walletMenu.className = 'wallet-menu';
      walletMenu.innerHTML =
        '<div class="wm-account">' + short(getState().account || '') + '</div>' +
        '<button class="wm-item" type="button">Disconnect</button>';
      btn.parentElement.style.position = 'relative';
      btn.parentElement.appendChild(walletMenu);
      btn.dataset.open = '1';
      document.addEventListener('click', outsideClose, true);
      document.addEventListener('keydown', escClose, true);

      walletMenu.querySelector('.wm-item').addEventListener('click', async (e) => {
        e.stopPropagation();
        closeWalletMenu();
        btn.disabled = true;
        const r = await disconnect();
        btn.disabled = false;
        if (!r.ok) setPending('Disconnect failed: ' + (r.reason || 'unknown'));
        else if (r.revoked === false) setPending('Disconnected. The wallet may still remember this site -- clear it there too if you want a fresh prompt.');
        render();
      });
    }

    // Provider events (accountsChanged / chainChanged / disconnect) keep the
    // button honest without a reload.
    onWallet(render);

    // RECONNECT ON BOOT.
    //
    // The app only ever connected when the player CLICKED, so a returning
    // visitor whose wallet was already authorised for this site booted into
    // PREVIEW with an empty local mirror: the card read "no tool - buy Wood"
    // and "no gems yet" for a wallet the chain reports as tier 1, 20/20, not
    // broken. Nothing was wrong with the reconciliation code -- it was never
    // invoked, because the only caller was the button.
    //
    // `silent: true` uses eth_accounts, which cannot open a wallet prompt, so
    // a returning player is reconnected without being nagged. A first-time
    // visitor has no authorised account, gets an empty list, and the button
    // still works as the way to connect.
    //
    // Swallowed deliberately: a wallet-less browser, or a wallet that throws
    // on eth_accounts, must not surface as a connection error the player did
    // not cause.
    Promise.resolve()
      .then(() => connect({ silent: true }))
      .then((r) => { if (r && r.ok) render(); })
      .catch(() => {});

    // A connected wallet must show its REAL balance, because a purchase is
    // sized against it. The scene starts with a simulated balance for the
    // offline preview, and that fiction must never size a real transaction.
    // Refreshed here and on every provider event, so an account switch or a
    // chain change cannot leave a stale figure on screen.
    import('/src/onchain.js').then(({ walletBalanceWeiOnchain, onchainActive }) => {
      const sync = async () => {
        if (!onchainActive()) return;
        // Adopt the chain's view of the held TOOL as well as the balance. The
        // belt renders from a local mirror that starts empty, so without this a
        // player who already owns a tool is told to buy it again -- and that
        // second purchase reverts TierLocked after they have signed it.
        await window.__scene?.refreshChainTool?.();
        const b = await walletBalanceWeiOnchain();
        window.__scene?.setChainBalance?.(b);
        render();
      };
      window.__syncBalance = sync;
      sync();
      onWallet(sync);
      // The immediate sync() above runs BEFORE the silent reconnect resolves,
      // so onchainActive() is false and it returns without doing anything. If
      // the provider never emits an event for that transition, the page would
      // sit connected with an empty mirror again -- so ask the wallet directly
      // once the app's own reconnect has had a chance to land.
      import('/src/wallet.js').then(({ getState }) => {
        const waitForConnect = (n) => {
          if (getState().connected) return sync();
          if (n <= 0) return;
          setTimeout(() => waitForConnect(n - 1), 400);
        };
        setTimeout(() => waitForConnect(25), 600);
      });
    }).catch(() => {
      // No chain module in this build: the offline preview keeps working.
    });

    // UNSAVED-QUEUE GUARD: the settle queue lives in memory. Closing or
    // reloading with hunts queued drops them permanently -- the gems were never
    // on-chain. The browser's own leave-confirmation is the last line of
    // defence; the badge and the settle button are the first.
    window.addEventListener('beforeunload', (e) => {
      const q = window.__scene?.queue;
      if (q && q.size > 0) {
        e.preventDefault();
        e.returnValue = `You have ${q.size} unsettled hunt${q.size === 1 ? '' : 's'}. Leave now and they are lost.`;
        return e.returnValue;
      }
      return undefined;
    });

    render();
  </script>
</body>
</html>
