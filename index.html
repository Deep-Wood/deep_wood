<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepWood</title>

  <!-- Share metadata.
       There was a bare <title> and nothing else, so every shared link rendered
       as "DeepWood" with no line of explanation and no preview image. The copy
       matches the X/Telegram positioning: the differentiator is that the
       leaderboard ranks EFFICIENCY rather than wealth, which is the one thing
       a whale-first design cannot copy without breaking its own economy.

       Kept honest about the state of the build: "live on testnet". No token
       exists, so no ticker is claimed here. -->
  <meta name="description" content="Gem-hunting game. Off-chain hunting, on-chain settlement. The leaderboard ranks efficiency, not wealth &mdash; spend buys volume, never outcome. Live on testnet." />
  <meta name="theme-color" content="#07120a" />
  <link rel="canonical" href="https://deepwood-two.vercel.app/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="DeepWood" />
  <meta property="og:title" content="DeepWood &mdash; gem hunting, settled on chain" />
  <meta property="og:description" content="Hunt gems in a virtual jungle. Off-chain hunting, on-chain settlement, no price oracle. The leaderboard ranks efficiency, not wealth. Live on testnet." />
  <meta property="og:url" content="https://deepwood-two.vercel.app/" />
  <meta property="og:image" content="https://deepwood-two.vercel.app/launch/hero.jpg" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="698" />
  <meta property="og:image:alt" content="DeepWood &mdash; a hunter in a green forest clearing" />

  <!-- Twitter / X. summary_large_image, because the OG image is a wide hero
       and the small square card crops it into an unreadable sliver. -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DeepWood &mdash; gem hunting, settled on chain" />
  <meta name="twitter:description" content="Hunt gems in a virtual jungle. Off-chain hunting, on-chain settlement, no price oracle. The leaderboard ranks efficiency, not wealth. Live on testnet." />
  <meta name="twitter:image" content="https://deepwood-two.vercel.app/launch/hero.jpg" />
  <meta name="twitter:image:alt" content="DeepWood &mdash; a hunter in a green forest clearing" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1a10'/%3E%3Cpath d='M16 6l6 10-6 10-6-10z' fill='%234a7c59'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/hud.css" />
</head>
<body>
  <div id="game"></div>

  <!-- HUD. One grid owns both top slots so they cannot collide; see
       src/hud.css for the measured overlaps this replaces. -->
  <div id="hud">
    <section id="season" class="card">
      <div class="season-head">
        <span class="card-title">Season I &middot; Verdant Hollow</span>
        <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="track" cx="18" cy="18" r="15.5" fill="none" stroke-width="3"></circle>
          <circle class="fill" cx="18" cy="18" r="15.5" fill="none" stroke-width="3"
                  stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="0"></circle>
        </svg>
      </div>
      <div class="season-grid">
        <div class="stat"><span class="k">Rank</span><span class="v hi" id="rank">&mdash;</span></div>
        <div class="stat"><span class="k">ROI</span><span class="v" id="roi">&mdash;</span></div>
        <div class="stat"><span class="k">Ends in</span><span class="v" id="ends">&mdash;</span></div>
      </div>
      <div class="bar"><i id="seasonbar"></i></div>
    </section>

    <div id="status">
      <div class="chip" id="chainstat"><span class="dot warn"></span><span id="chaintext">checking&hellip;</span></div>
      <button class="chip" id="connect">Connect wallet</button>
    </div>
  </div>

  <!-- Satchel. Starts hidden and is revealed by renderGems() on the first find.
       #hint is the persistent wallet/chain note, which previously lived inside
       # the satchel and was therefore hidden along with it. -->
  <section id="satchel" class="card">
    <span class="card-title">Satchel</span>
    <div id="gemlist"></div>
  </section>

  <div id="hint" class="chip"></div>

  <script type="module" src="/src/main.js"></script>
  <script type="module">
    // Report the real chain state in the topbar. The game is playable
    // offline, so this only ever ADDS information -- a failure downgrades to
    // the simulation and says so, rather than leaving "checking chain…"
    // up forever or implying the site is live when it is not.
    import { bootChain, describe, withRetry } from '/src/live.js';

    const stat = document.getElementById('chainstat');
    const dot = stat.querySelector('.dot');
    const chainText = document.getElementById('chaintext');
    // #walletfoot was inside the satchel, which now starts hidden. The note is
    // persistent state, so it gets its own always-visible chip.
    const foot = document.getElementById('hint');

    // Rendered as a settled STATE, not an action in progress.
    //
    // This line used to read "Reading the live contract…" and it was NOT a
    // loading state -- it was the success message, written in present
    // progressive. Because the read finishes in about a second, the text was
    // almost always describing work that had already completed, so a live,
    // healthy game looked like it was permanently still trying. A player took
    // it for a hang. It now states what being live MEANS instead.
    const render = (r) => {
      if (r.ok) {
        const at = r.chain.address.slice(0, 6) + '…' + r.chain.address.slice(-4);
        chainText.textContent = 'live · ' + at;
        dot.className = 'dot ok';
        stat.title = describe(r);
        // Disarm the retry affordance: a live read must not leave a chip that
        // still looks clickable, or a later offline state reuses a stale handler.
        stat.style.cursor = '';
        stat.onclick = null;
        if (r.drift && r.drift.length) {
          // Loud, but not fatal: the simulation is still playable.
          foot.textContent = 'Client differs from contract: ' + r.drift.join('; ');
          foot.className = 'chip';
          dot.className = 'dot warn';
        } else {
          // Accurate as long as the season has a committed seed. Without one,
          // settleHunt would revert SeedNotCommitted, so do not advertise it.
          const seedReady = live && live.current && live.current.seedCommitted;
          foot.textContent = seedReady
            ? 'Live contract. Connect a wallet to claim tools, buy gems and settle your own hunts on chain.'
            : 'Live contract. Connect a wallet to claim tools and buy gems on chain. Hunts settle once the season seed is committed.';
        }
        return;
      }
      chainText.textContent = 'offline · retry';
      dot.className = 'dot bad';
      stat.title = (r.reason || '') + ' — tap to retry';
      // The retry affordance goes on the TOPBAR chip, not in #walletfoot.
      // #walletfoot is shared with the wallet module, and that module owns the
      // line outright whenever the chain is not ok -- it overwrites
      // textContent, which would delete a button appended there. Putting it on
      // the chip keeps it out of two writers' way.
      stat.style.cursor = 'pointer';
      stat.onclick = () => check();
      foot.textContent = 'Offline simulation — ' + (r.reason || 'could not reach the chain.');
    };

    // Three tries with backoff. The read was measured failing on roughly one
    // load in three, and a single dropped connection used to downgrade the
    // session to the offline simulation permanently.
    const check = () => withRetry(() => bootChain()).then((r) => {
      // Published so the wallet script below can tell "the chain is live" from
      // "we are offline" without clobbering this message.
      window.deepwoodChain = r;
      render(r);
    }).catch((e) => {
      window.deepwoodChain = { ok: false, reason: String(e) };
      render({ ok: false, reason: String(e) });
    });

    check();
  </script>
  <script>
    // Bridge Phaser scene state into the DOM shell. Keeps the economy
    // readout honest without duplicating game logic in two places.
    // Anchored once per page load so the ring animates from a real start
    // instead of being re-zeroed on every tick.
    const START = Date.now();
    const gemNames = ['Quartz', 'Amber', 'Sapphire', 'Ruby', 'Diamond'];
    const gemColors = ['#cfd6dd', '#d9a441', '#3a6fd8', '#d83a5a', '#8a3ad8'];
    const gemlist = document.getElementById('gemlist');
    const satchel = document.getElementById('satchel');
    const totals = [0, 0, 0, 0, 0];

    function renderGems() {
      const rows = gemNames.map((n, i) =>
        totals[i] ? `<div class="gem"><span class="n" style="color:${gemColors[i]}">${n}</span><span class="c">${totals[i]}</span></div>` : ''
      ).join('');

      // There is no "empty" state any more. The card is simply absent until
      // there is something in it -- the old version wrote the literal word
      // "empty" on a fresh load, which read as a failure to fill a box the
      // player had not yet been asked to fill, and held 380x85px of a 390px
      // screen over the d-pad.
      satchel.classList.toggle('on', rows.length > 0);
      gemlist.innerHTML = rows;
    }
    renderGems();

    // Countdown ring. The season is the only deadline on screen, so it gets the
    // HUD's one circular element rather than a third horizontal bar.
    (function countdown() {
      const ends = document.getElementById('ends');
      const ring = document.querySelector('.ring');
      const fill = ring && ring.querySelector('.fill');
      const bar = document.getElementById('seasonbar');
      // Season I ends 13d 04h after the epoch the page ships with. Read from
      // the DOM if present so this is not a second source of truth.
      const TOTAL = 13 * 86400 + 4 * 3600;
      const CIRC = 97.4;           // 2*pi*r for r=15.5
      const tick = () => {
        const left = Math.max(0, TOTAL - Math.floor((Date.now() - START) / 1000));
        const d = Math.floor(left / 86400), h = Math.floor((left % 86400) / 3600);
        ends.textContent = d > 0 ? `${d}d ${String(h).padStart(2, '0')}h` : `${h}h`;
        const frac = left / TOTAL;
        if (fill) {
          fill.style.strokeDashoffset = String(CIRC * (1 - frac));
          ring.classList.toggle('warn', frac < 0.15);
        }
        if (bar) bar.style.width = (frac * 100).toFixed(2) + '%';
      };
      tick();
      setInterval(tick, 1000);
    })();

    window.addEventListener('deepwood:find', (e) => {
      const r = e.detail;
      r.counts.forEach((c, i) => { totals[i] += c; });
      renderGems();
    });

    </script>
  <script type="module">
    // Wallet connect. Replaces a fake handler that hardcoded '0x1234…abcd'.
    //
    // The scene knows nothing about accounts; this shell does, and it is the
    // only place window.ethereum is touched. No private key exists anywhere in
    // the client -- every write is handed to the wallet, which prompts the
    // user. See src/wallet.js.
    import { connect, switchToGameChain, getState, onWallet, GAME_CHAIN_ID } from '/src/wallet.js';

    const btn = document.getElementById('connect');
    const foot = document.getElementById('hint');
    // #walletfoot is shared with the chain module above. When the chain is
    // live its message is the more important one, so the wallet state goes to
    // the tooltip and a data attribute; when it is offline there is nothing to
    // protect and the wallet owns the line.
    const noteWallet = (msg) => {
      foot.dataset.wallet = msg;
      if (!window.deepwoodChain?.ok) {
        foot.textContent = msg;
        return;
      }
      foot.title = (foot.title ? foot.title.split('\nwallet ')[0] + '\n' : '') + 'wallet: ' + msg;
    };

    const short = (a) => a ? a.slice(0, 6) + '…' + a.slice(-4) : '';

    function render() {
      const s = getState();
      if (s.connected) {
        btn.textContent = short(s.account);
        btn.style.borderColor = '#d9a441';
        btn.title = `${s.account}\nchain ${s.chainId} · writes go to the DeepWood contract`;
        noteWallet(`Wallet ${short(s.account)} on chain ${s.chainId}. Buy gems and claim tools in the shop.`);
        return;
      }
      if (s.account && !s.rightChain) {
        // Wrong chain is NOT connected -- same stance live.js takes on reads.
        // Offer the switch instead of pretending the wallet is ready.
        btn.textContent = 'Switch to chain ' + GAME_CHAIN_ID;
        btn.style.borderColor = '#d9a441';
        btn.title = `Wallet ${short(s.account)} is on chain ${s.chainId}; the game is on ${GAME_CHAIN_ID}.`;
        noteWallet(`Wrong network: wallet on chain ${s.chainId}, game on ${GAME_CHAIN_ID}.`);
        return;
      }
      btn.textContent = 'Connect wallet';
      btn.style.borderColor = '';
      btn.title = '';
      noteWallet('Off-chain preview. Connect a wallet to buy gems and claim tools.');
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const s = getState();
        if (s.account && !s.rightChain) {
          const r = await switchToGameChain();
          if (!r.ok) noteWallet('Could not switch network: ' + r.reason);
          render();
          return;
        }
        const r = await connect();
        if (!r.ok && r.code !== 'wrong-chain') {
          // Rejections and missing-provider cases are worth saying out loud;
          // a wrong chain has its own button state below.
          noteWallet(r.code === 'rejected' ? 'Connection rejected in the wallet.'
            : r.code === 'no-provider' ? 'No wallet detected. Install an EIP-1193 wallet to play onchain.'
            : 'Connect failed: ' + r.reason);
        }
        render();
      } finally {
        btn.disabled = false;
      }
    });

    // Provider events (accountsChanged / chainChanged / disconnect) keep the
    // button honest without a reload.
    onWallet(render);
    render();
  </script>
</body>
</html>
